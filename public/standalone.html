<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EconBiz - Story Brand Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d1117;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    /* 1. Header */
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #1c232d;
      background: rgba(13, 17, 23, 0.95);
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
      user-select: none;
    }
    .brand-blue {
      color: #0080FF;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: #161c24;
      border: 1px solid #232c38;
      padding: 4px 10px;
      border-radius: 8px;
    }
    /* Main Layout: Header -> Upload Area -> Live Preview Canvas -> Download Button -> Footer */
    main {
      flex: 1;
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    /* 2. Upload Area */
    .upload-card {
      background: #12161f;
      border: 2px dashed #242f40;
      border-radius: 18px;
      padding: 20px 16px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .upload-card.dragover {
      border-color: #0080FF;
      background: rgba(0, 128, 255, 0.08);
    }
    .upload-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #18212e;
      border: 1px solid #2a374c;
      color: #0080FF;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }
    .upload-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }
    .upload-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
      margin-bottom: 14px;
    }
    .upload-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 380px;
      margin: 0 auto;
    }
    .btn-secondary {
      background: #18212e;
      border: 1px solid #293649;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-secondary:hover {
      background: #202b3c;
      border-color: #3b4d68;
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }
    .btn-camera {
      background: rgba(0, 128, 255, 0.15);
      border: 1px solid rgba(0, 128, 255, 0.45);
      color: #ffffff;
    }
    .btn-camera:hover {
      background: rgba(0, 128, 255, 0.25);
    }
    .samples-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      flex-wrap: wrap;
    }
    .sample-btn {
      background: #161c24;
      border: 1px solid #232c38;
      color: #cbd5e1;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .sample-btn:hover {
      color: #ffffff;
      border-color: #0080FF;
    }
    /* 3. Live Preview Canvas */
    .preview-card {
      background: #12161f;
      border: 1px solid #1f2734;
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      padding: 0 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0080FF;
      display: inline-block;
      margin-right: 6px;
    }
    .canvas-viewport {
      background: #090b0e;
      border: 1px solid #1a222c;
      border-radius: 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      max-height: 62vh;
      padding: 10px;
      overflow: hidden;
    }
    canvas {
      max-width: 100%;
      max-height: 58vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    .drag-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 18, 24, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid #232b38;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      pointer-events: none;
      white-space: nowrap;
    }
    .position-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .pos-btn-group {
      display: flex;
      gap: 6px;
    }
    .pos-btn {
      background: #18202c;
      border: 1px solid #252f3e;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pos-btn.active, .pos-btn:hover {
      background: #0080FF;
      border-color: #0080FF;
      color: #ffffff;
    }
    /* 4. Prominent Download Button */
    .btn-download {
      width: 100%;
      background: #0080FF;
      color: #ffffff;
      border: none;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 128, 255, 0.35);
      transition: transform 0.1s, background-color 0.15s;
    }
    .btn-download:hover {
      background: #0070e0;
      box-shadow: 0 6px 24px rgba(0, 128, 255, 0.45);
    }
    .btn-download:active {
      transform: scale(0.98);
    }
    /* 5. Footer: "Powered by Osanda Nimsara" */
    footer {
      border-top: 1px solid #1a212b;
      padding: 24px 16px;
      text-align: center;
      margin-top: auto;
    }
    .footer-credit {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }
    .footer-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    /* Toast */
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 29, 39, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 128, 255, 0.5);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 100;
    }
    #toast.show {
      opacity: 1;
      transform: translate(-50%, 6px);
    }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast">Photo ready with EconBiz overlay!</div>

  <!-- 1. Header: "EconBiz" with "Econ" in white, "B" in blue, "iz" in white -->
  <header>
    <div class="brand">Econ<span class="brand-blue">B</span>iz</div>
    <div class="badge">Story Template</div>
  </header>

  <!-- Main Flow: Header -> Upload Area -> Live Preview Canvas -> Download Button -> Footer -->
  <main>
    <!-- Hidden Inputs -->
    <input type="file" id="galleryInput" accept="image/*" style="display: none;">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

    <!-- 2. Upload Area -->
    <div class="upload-card" id="dropArea">
      <div class="upload-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </div>
      <div class="upload-title">Upload Photo</div>
      <div class="upload-subtitle">Snap a picture or select an existing photo from your gallery</div>

      <div class="upload-actions">
        <button class="btn-secondary btn-camera" id="btnCamera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          Take Photo
        </button>
        <button class="btn-secondary" id="btnGallery">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          Photo Gallery
        </button>
      </div>

      <div class="samples-row">
        <span>Sample test:</span>
        <button class="sample-btn" id="sampleStory">Story 9:16</button>
        <button class="sample-btn" id="sampleLight">Bright Background</button>
      </div>
    </div>

    <!-- 3. Live Preview Canvas -->
    <div class="preview-card">
      <div class="preview-header">
        <span><span class="dot"></span>Live Preview</span>
        <span id="resLabel">1080 × 1920 px</span>
      </div>

      <div class="canvas-viewport" id="canvasViewport">
        <canvas id="storyCanvas"></canvas>
        <div class="drag-hint">Drag logo to adjust position</div>
      </div>

      <div class="position-row">
        <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">Position:</span>
        <div class="pos-btn-group">
          <button class="pos-btn active" id="posTop">Top (9%)</button>
          <button class="pos-btn" id="posCenter">Center</button>
          <button class="pos-btn" id="posBottom">Bottom</button>
        </div>
      </div>
    </div>

    <!-- 4. Prominent Download Button -->
    <button class="btn-download" id="downloadBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download Branded Photo
    </button>
  </main>

  <!-- 5. Footer: "Powered by Osanda Nimsara" -->
  <footer>
    <div class="footer-credit">Powered by Osanda Nimsara</div>
    <div class="footer-sub">EconBiz Watermark Overlay</div>
  </footer>

  <script>
    // State
    let baseImage = null;
    let fileName = 'EconBiz-Story';
    let posYPercent = 9; // default 9% top center (8-10% from top)
    let posXPercent = 50; // horizontally centered
    let logoScale = 36; // scale proportional to image width

    const canvas = document.getElementById('storyCanvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('toast');
    const resLabel = document.getElementById('resLabel');

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Render on Canvas at Full Original Resolution
    function render() {
      if (!baseImage) return;

      const w = baseImage.naturalWidth || 1080;
      const h = baseImage.naturalHeight || 1920;

      canvas.width = w;
      canvas.height = h;
      resLabel.innerText = w + ' × ' + h + ' px';

      ctx.clearRect(0, 0, w, h);

      // 1. Draw base photo
      ctx.drawImage(baseImage, 0, 0, w, h);

      // 2. Soft protective contrast scrim gradient (top area)
      if (posYPercent < 28) {
        const scrimHeight = h * 0.26;
        const grad = ctx.createLinearGradient(0, 0, 0, scrimHeight);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
        grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.20)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, scrimHeight);
      }

      // 3. Draw EconBiz Logo Overlay
      // Accurately drawn using HTML5 Canvas 2D context:
      // Font: Bold, heavy sans-serif
      // Colors: "Econ" in solid crisp white (#FFFFFF), letter "B" in vibrant blue (#0080FF), "iz" in white (#FFFFFF)
      // Soft drop shadow
      // Pinned horizontally centered in upper section with proportional top padding (~8-10%)
      // Automatically scaled proportionally to image width
      ctx.save();

      const cx = (posXPercent / 100) * w;
      const cy = (posYPercent / 100) * h;
      const targetLogoWidth = (logoScale / 100) * w;
      const fontSize = targetLogoWidth * 0.30;

      ctx.font = '900 ' + fontSize + 'px "Montserrat", "Arial Black", "Plus Jakarta Sans", -apple-system, sans-serif';
      ctx.textBaseline = 'middle';

      // Soft drop shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = w * 0.016;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = w * 0.005;

      const textEcon = 'Econ';
      const textB = 'B';
      const textIz = 'iz';

      const wEcon = ctx.measureText(textEcon).width;
      const wB = ctx.measureText(textB).width;
      const wIz = ctx.measureText(textIz).width;
      const totalWidth = wEcon + wB + wIz;

      let startX = cx - totalWidth / 2;

      // Draw "Econ" (#FFFFFF)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(textEcon, startX, cy);
      startX += wEcon;

      // Draw "B" (#0080FF)
      ctx.fillStyle = '#0080FF';
      ctx.fillText(textB, startX, cy);
      startX += wB;

      // Draw "iz" (#FFFFFF)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(textIz, startX, cy);

      ctx.restore();
    }

    // Load initial sample
    function loadSample(type) {
      const temp = document.createElement('canvas');
      temp.width = 1080;
      temp.height = 1920;
      const tctx = temp.getContext('2d');

      if (type === 'light') {
        const g = tctx.createLinearGradient(0, 0, 1080, 1920);
        g.addColorStop(0, '#e2e8f0');
        g.addColorStop(0.5, '#cbd5e1');
        g.addColorStop(1, '#94a3b8');
        tctx.fillStyle = g;
        tctx.fillRect(0, 0, 1080, 1920);
      } else {
        const g = tctx.createLinearGradient(0, 0, 1080, 1920);
        g.addColorStop(0, '#111827');
        g.addColorStop(0.35, '#1e293b');
        g.addColorStop(0.7, '#0f172a');
        g.addColorStop(1, '#090d16');
        tctx.fillStyle = g;
        tctx.fillRect(0, 0, 1080, 1920);

        const glow = tctx.createRadialGradient(540, 500, 80, 540, 500, 700);
        glow.addColorStop(0, 'rgba(0, 128, 255, 0.22)');
        glow.addColorStop(1, 'transparent');
        tctx.fillStyle = glow;
        tctx.fillRect(0, 0, 1080, 1920);

        tctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        tctx.strokeStyle = 'rgba(0, 128, 255, 0.35)';
        tctx.lineWidth = 3;
        tctx.beginPath();
        tctx.roundRect(100, 720, 880, 580, [24]);
        tctx.fill();
        tctx.stroke();

        tctx.fillStyle = '#ffffff';
        tctx.font = '800 48px "Montserrat", sans-serif';
        tctx.fillText('ECONOMICS & BUSINESS', 160, 850);
        tctx.fillStyle = '#0080FF';
        tctx.font = '700 32px "Plus Jakarta Sans", sans-serif';
        tctx.fillText('Student Chapter · 2026 Summit', 160, 910);
        tctx.fillStyle = '#94a3b8';
        tctx.font = '400 28px "Plus Jakarta Sans", sans-serif';
        tctx.fillText('Market Insights & Leadership Forum', 160, 980);
      }

      const img = new Image();
      img.src = temp.toDataURL('image/jpeg', 0.95);
      img.onload = () => {
        baseImage = img;
        render();
      };
    }

    // File Handling
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('Please select an image file');
        return;
      }
      const rawName = file.name.replace(/\.[^/.]+$/, '');
      fileName = 'EconBiz-' + rawName;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          baseImage = img;
          render();
          showToast('Photo loaded with EconBiz overlay!');
        };
      };
      reader.readAsDataURL(file);
    }

    // Button event listeners
    const galleryInput = document.getElementById('galleryInput');
    const cameraInput = document.getElementById('cameraInput');

    document.getElementById('btnGallery').onclick = () => galleryInput.click();
    document.getElementById('btnCamera').onclick = () => cameraInput.click();

    galleryInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
    cameraInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };

    document.getElementById('sampleStory').onclick = () => loadSample('story');
    document.getElementById('sampleLight').onclick = () => loadSample('light');

    // Drag and Drop
    const dropArea = document.getElementById('dropArea');
    dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
    dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
    dropArea.addEventListener('drop', (e) => {
      e.preventDefault();
      dropArea.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    // Position buttons
    const posTop = document.getElementById('posTop');
    const posCenter = document.getElementById('posCenter');
    const posBottom = document.getElementById('posBottom');

    function setActivePos(btn, val) {
      [posTop, posCenter, posBottom].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      posYPercent = val;
      render();
    }

    posTop.onclick = () => setActivePos(posTop, 9);
    posCenter.onclick = () => setActivePos(posCenter, 50);
    posBottom.onclick = () => setActivePos(posBottom, 90);

    // Touch & Mouse Drag on Canvas
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initX = 50;
    let initY = 9;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initX = posXPercent;
      initY = posYPercent;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const rect = canvas.getBoundingClientRect();
      const dx = ((e.clientX - dragStartX) / rect.width) * 100;
      const dy = ((e.clientY - dragStartY) / rect.height) * 100;
      posXPercent = Math.max(5, Math.min(95, initX + dx));
      posYPercent = Math.max(4, Math.min(96, initY + dy));
      render();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (isDragging) {
        isDragging = false;
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      }
    });

    // High-Resolution Download
    document.getElementById('downloadBtn').onclick = () => {
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = (fileName || 'EconBiz-Story') + '.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Downloaded high-resolution photo!');
    };

    // Initialize with story demo
    loadSample('story');
  </script>
</body>
</html>
